services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: quickcart
      POSTGRES_USER: quickcart
      POSTGRES_PASSWORD: quickcart123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://quickcart:quickcart123@db:5432/quickcart
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./services/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data: