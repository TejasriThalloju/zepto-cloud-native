services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: quickcart
      POSTGRES_USER: quickcart
      POSTGRES_PASSWORD: quickcart
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://quickcart:quickcart@db:5432/quickcart
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db, redis]
  web:
    build: ./services/web
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  db:
