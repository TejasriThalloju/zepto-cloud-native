apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: quickcart-api}
spec:
  podSelector: {matchLabels: {app: quickcart-api}}
  policyTypes: ["Ingress","Egress"]
  ingress:
  - from: [{podSelector: {matchLabels: {app: quickcart-web}}}]
    ports: [{protocol: TCP, port: 8000}]
  egress:
  - {}
