name: QuickCart CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_API: quickcart/api
  ECR_WEB: quickcart/web
  EKS_CLUSTER: quickcart-eks
  K8S_NAMESPACE: quickcart


jobs:

  # ============================================================
  # CI - TEST APPLICATION
  # ============================================================

  test:

    name: Test Application

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # TEST PYTHON FASTAPI
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install API dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # API IMPORT CHECK
      # --------------------------------------------------------

      - name: Check API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://quickcart:quickcart123@localhost:5432/quickcart
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "from app.main import app; print(app.title)"


      # ========================================================
      # TEST FRONTEND
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/web/package-lock.json


      - name: Install Web dependencies
        working-directory: services/web
        run: npm ci


      - name: Build Web application
        working-directory: services/web
        run: npm run build


  # ============================================================
  # BUILD, SCAN AND PUSH
  # ============================================================

  build-scan-push:

    name: Build Scan and Push

    needs: test

    runs-on: ubuntu-latest

    # Do not push images for Pull Requests
    if: github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # CONFIGURE AWS USING GITHUB OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # LOGIN TO AMAZON ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # CREATE IMAGE REFERENCES
      # --------------------------------------------------------

      - name: Set image variables
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "API_IMAGE=$REGISTRY/${{ env.ECR_API }}:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$REGISTRY/${{ env.ECR_WEB }}:$IMAGE_TAG" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # DISPLAY IMAGE REFERENCES
      # --------------------------------------------------------

      - name: Display image references
        run: |
          echo "API_IMAGE=$API_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE"


      # ========================================================
      # BUILD API IMAGE
      # ========================================================

      - name: Build API Docker image
        run: |
          docker build \
            -t "$API_IMAGE" \
            ./services/api


      # ========================================================
      # SCAN API WITH TRIVY
      # ========================================================

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"


      # ========================================================
      # PUSH API IMAGE
      # ========================================================

      - name: Push API image to ECR
        run: |
          docker push "$API_IMAGE"


      # ========================================================
      # BUILD WEB IMAGE
      # ========================================================

      - name: Build Web Docker image
        run: |
          docker build \
            -t "$WEB_IMAGE" \
            ./services/web


      # ========================================================
      # SCAN WEB WITH TRIVY
      # ========================================================

      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          vuln-type: "os,library"


      # ========================================================
      # PUSH WEB IMAGE
      # ========================================================

      - name: Push Web image to ECR
        run: |
          docker push "$WEB_IMAGE"


      # ========================================================
      # TAG API AS LATEST
      # ========================================================

      - name: Tag API image as latest
        run: |
          API_LATEST="${API_IMAGE%:*}:latest"

          docker tag "$API_IMAGE" "$API_LATEST"

          docker push "$API_LATEST"


      # ========================================================
      # TAG WEB AS LATEST
      # ========================================================

      - name: Tag Web image as latest
        run: |
          WEB_LATEST="${WEB_IMAGE%:*}:latest"

          docker tag "$WEB_IMAGE" "$WEB_LATEST"

          docker push "$WEB_LATEST"


  # ============================================================
  # CD - DEPLOY TO EKS
  # ============================================================

  deploy:

    name: Deploy to EKS

    needs: build-scan-push

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # CONFIGURE AWS USING OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # SETUP KUBECTL
      # --------------------------------------------------------

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4


      # --------------------------------------------------------
      # CONNECT TO EKS
      # --------------------------------------------------------

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"


      # --------------------------------------------------------
      # VERIFY CLUSTER CONNECTION
      # --------------------------------------------------------

      - name: Verify EKS connection
        run: |
          kubectl get nodes


      # --------------------------------------------------------
      # APPLY KUBERNETES MANIFESTS
      # --------------------------------------------------------

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k k8s/


      # --------------------------------------------------------
      # GET AWS ACCOUNT ID
      # --------------------------------------------------------

      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"


      # ========================================================
      # UPDATE API IMAGE
      # ========================================================

      - name: Update API deployment
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          API_IMAGE="$REGISTRY/${{ env.ECR_API }}:$IMAGE_TAG"

          echo "Deploying API image: $API_IMAGE"

          kubectl set image \
            deployment/quickcart-api \
            api="$API_IMAGE" \
            -n "$K8S_NAMESPACE"


      # ========================================================
      # UPDATE WEB IMAGE
      # ========================================================

      - name: Update Web deployment
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          WEB_IMAGE="$REGISTRY/${{ env.ECR_WEB }}:$IMAGE_TAG"

          echo "Deploying WEB image: $WEB_IMAGE"

          kubectl set image \
            deployment/quickcart-web \
            web="$WEB_IMAGE" \
            -n "$K8S_NAMESPACE"


      # ========================================================
      # WAIT FOR POSTGRES
      # ========================================================

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            statefulset/postgres \
            -n "$K8S_NAMESPACE" \
            --timeout=5m


      # ========================================================
      # WAIT FOR REDIS
      # ========================================================

      - name: Wait for Redis
        run: |
          kubectl rollout status \
            deployment/redis \
            -n "$K8S_NAMESPACE" \
            --timeout=5m


      # ========================================================
      # WAIT FOR API
      # ========================================================

      - name: Wait for API deployment
        run: |
          kubectl rollout status \
            deployment/quickcart-api \
            -n "$K8S_NAMESPACE" \
            --timeout=5m


      # ========================================================
      # WAIT FOR WEB
      # ========================================================

      - name: Wait for Web deployment
        run: |
          kubectl rollout status \
            deployment/quickcart-web \
            -n "$K8S_NAMESPACE" \
            --timeout=5m


      # ========================================================
      # SHOW FINAL STATUS
      # ========================================================

      - name: Show Kubernetes status
        run: |
          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n "$K8S_NAMESPACE"

          echo "========== STATEFULSETS =========="
          kubectl get statefulsets -n "$K8S_NAMESPACE"

          echo "========== PODS =========="
          kubectl get pods -n "$K8S_NAMESPACE"

          echo "========== SERVICES =========="
          kubectl get services -n "$K8S_NAMESPACE"