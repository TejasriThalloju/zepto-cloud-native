apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickcart-api
  namespace: quickcart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: quickcart-api

  template:
    metadata:
      labels:
        app: quickcart-api

    spec:
      containers:
        - name: api
          image: PLACEHOLDER_API_IMAGE
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: quickcart-config
                  key: APP_NAME

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quickcart-config
                  key: REDIS_URL

            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: quickcart-config
                  key: CORS_ORIGINS

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quickcart-db-secret
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"

            limits:
              memory: "512Mi"
              cpu: "500m"